<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel · SALES ARENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="./shared.css" />
<style>
/* ============== Panel layout ============== */
.cp-wrap { padding: 24px 32px 64px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }

.cp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 18px;
  border-bottom: 1px solid rgba(180,124,255,0.2);
  flex-wrap: wrap; gap: 16px;
}
.cp-header-left { flex: 1; min-width: 280px; }
.cp-header-tag {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.4em; color: rgba(180,124,255,0.8); margin-bottom: 4px;
}
.cp-header-title {
  font-family: var(--font-display); font-size: 28px;
  background: linear-gradient(90deg, #FFD93D, #FF8C42, #FF4FB6);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 0.06em;
}
.cp-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-ghost {
  padding: 8px 14px; background: rgba(20,8,40,0.6);
  border: 1px solid rgba(180,124,255,0.3); border-radius: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 11px;
  letter-spacing: 0.15em; color: rgba(255,255,255,0.85);
  text-decoration: none; display: inline-flex; align-items: center;
}
.btn-ghost:hover { border-color: var(--c-purple); color: #fff; }
.btn-danger {
  padding: 8px 14px; background: rgba(255,79,182,0.1);
  border: 1px solid rgba(255,79,182,0.5); border-radius: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 11px;
  letter-spacing: 0.15em; color: #FF4FB6;
}
.btn-danger.solid { background: #FF4FB6; color: #0a0118; }

.btn-week {
  padding: 10px 18px;
  background: linear-gradient(135deg, #FFD93D, #FF8C42);
  border: none; border-radius: 8px;
  font-family: var(--font-display); font-weight: 900; font-size: 12px;
  letter-spacing: 0.15em; color: #0a0118;
  box-shadow: 0 4px 16px rgba(255,140,66,0.5);
  transition: all 0.2s;
}
.btn-week:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,140,66,0.8); }
.btn-week.confirm { background: linear-gradient(135deg, #FF4FB6, #B47CFF); color: #fff; }

.cp-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: rgba(20,8,40,0.6);
  border: 1px solid var(--accent-40, rgba(180,124,255,0.4));
  border-radius: 10px; padding: 12px 16px;
}
.stat-card .label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.3em; color: rgba(255,255,255,0.5); margin-bottom: 4px;
}
.stat-card .value {
  font-family: var(--font-display); font-size: 22px; font-weight: 900;
  text-shadow: 0 0 10px var(--accent-80, rgba(180,124,255,0.8));
}

.cp-info-banner {
  background: linear-gradient(135deg, rgba(255,79,182,0.08), rgba(180,124,255,0.08));
  border: 1px solid rgba(255,79,182,0.3);
  border-radius: 10px;
  padding: 12px 18px;
  margin-bottom: 20px;
  font-family: var(--font-body, 'Rajdhani', sans-serif);
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.02em;
  line-height: 1.6;
}
.cp-info-banner em {
  color: #FF4FB6;
  font-style: normal;
  font-weight: 700;
}

/* ============== Lista por vendedor (organizado y ordenado) ============== */
.cp-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.seller-block {
  background: linear-gradient(135deg, rgba(20,8,40,0.7), rgba(35,15,65,0.7));
  border: 2px solid var(--accent-40, rgba(180,124,255,0.4));
  border-radius: 16px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.seller-block::before {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 0; width: 4px;
  background: linear-gradient(180deg, var(--accent), var(--accent-alt));
  box-shadow: 0 0 16px var(--accent);
}
.seller-block-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.seller-block-info { flex: 1; min-width: 0; }
.seller-block-name {
  font-family: var(--font-display); font-weight: 900; font-size: 18px;
  color: #fff; letter-spacing: 0.04em; text-shadow: 0 0 8px var(--accent);
  margin-bottom: 2px;
}
.seller-block-total {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent); letter-spacing: 0.15em;
}
.seller-block-total strong {
  font-family: var(--font-display); font-size: 16px; font-weight: 900;
}

/* Botones de páginas dentro de cada vendedor */
.page-btns { display: flex; flex-direction: column; gap: 8px; }
.page-btn {
  position: relative; width: 100%; text-align: left;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--accent-50, rgba(180,124,255,0.5));
  border-radius: 10px; padding: 10px 12px;
  cursor: pointer; overflow: hidden;
  transition: transform 0.15s, border-color 0.2s, background 0.2s;
  display: flex; align-items: center; gap: 12px;
}
.page-btn:hover {
  border-color: var(--accent);
  background: var(--accent-15, rgba(180,124,255,0.15));
  transform: translateX(2px);
}
.page-btn:active { transform: scale(0.98); }
.page-btn-info { flex: 1; min-width: 0; }
.page-btn-name {
  font-family: var(--font-display); font-weight: 900; font-size: 14px;
  color: #fff; letter-spacing: 0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-btn-count {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent); letter-spacing: 0.1em; margin-top: 2px;
}
.page-btn-count strong { font-family: var(--font-display); font-size: 13px; font-weight: 900; }
.page-btn-plus {
  width: 36px; height: 36px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-alt));
  color: #0a0118; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 900; font-size: 18px;
  box-shadow: 0 2px 12px var(--accent-80, rgba(180,124,255,0.7));
}

/* Summary table */
.cp-summary {
  margin-top: 32px;
  background: rgba(20,8,40,0.6);
  border: 1px solid rgba(180,124,255,0.2);
  border-radius: 14px; overflow: hidden;
}
.cp-summary-head {
  padding: 12px 18px;
  border-bottom: 1px solid rgba(180,124,255,0.2);
  font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.3em; color: rgba(180,124,255,0.9);
}
.summary-row {
  display: grid; grid-template-columns: 40px 40px 1fr auto;
  align-items: center; gap: 12px; padding: 10px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.summary-row.top { background: var(--accent-15, rgba(180,124,255,0.08)); }
.summary-rank { font-family: var(--font-display); font-weight: 900; font-size: 16px; }
.summary-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.summary-pages { font-size: 11px; color: rgba(255,255,255,0.55); display: flex; gap: 8px; flex-wrap: wrap; }
.summary-pages span { color: var(--accent); }
.summary-total { font-family: var(--font-display); font-weight: 900; font-size: 18px; }

@media (max-width: 768px) {
  .cp-wrap { padding: 16px 12px 32px; }
  .cp-header-title { font-size: 22px; }
  .cp-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="cp-wrap">
  <header class="cp-header">
    <div class="cp-header-left">
      <div class="cp-header-tag">◆ PANEL DE CONTROL · CONTADORA ◆</div>
      <h1 class="cp-header-title">REGISTRO DE VENTAS</h1>
    </div>
    <div class="cp-actions">
      <a href="./index.html" target="_blank" class="btn-ghost">▶ ABRIR ARENA</a>
      <button class="btn-reveal" id="btnReveal">💰 REVELAR COMISIÓN DEL DÍA</button>
      <button class="btn-week" id="btnWeek">🏁 CERRAR SEMANA</button>
      <button class="btn-ghost" id="btnUndo">↩ DESHACER</button>
      <button class="btn-danger" id="btnReset">⟳ RESET</button>
    </div>
  </header>

  <div class="cp-stats" id="cpStats"></div>

  <div class="cp-info-banner">
    💡 <strong>Tip:</strong> Pulsa <em>"REVELAR COMISIÓN"</em> cada nuevo día para que los vendedores vean la animación.
    Las <strong style="color:#FFD93D;">comisiones acumuladas de cada vendedor NO se borran</strong> entre días —
    se mantienen sumando hasta que cierres la semana.
  </div>

  <div class="cp-grid" id="cpGrid"></div>

  <div class="cp-summary">
    <div class="cp-summary-head">◆ RANKING COMPLETO</div>
    <div id="cpSummaryBody"></div>
  </div>
</div>

<script src="./shared.js"></script>
<script>
// ============== Render Panel ==============
function renderControlPanel() {
  const ranked = getRanked();
  const total = Object.values(state.sellers).reduce((a, b) => a + b, 0);
  const totalPages = SELLERS.reduce((s, x) => s + x.pages.length, 0);
  const leaderName = ranked[0]?.total > 0 ? ranked[0].name : '—';

  // Comisión del día
  let commissionLabel = '— No revelada';
  let commissionColor = '#B47CFF';
  if (state.commission && state.commission.todayDate === todayStr() && state.commission.todayAmount) {
    commissionLabel = `$${state.commission.todayAmount}${state.commission.todayPremium ? ' ★' : ''}`;
    commissionColor = state.commission.todayPremium ? '#FFD93D' : '#5EEAD4';
  }

  // Premium restantes este mes
  const premiumUsed = (state.commission && state.commission.month === monthStr())
    ? (state.commission.premiumUsedThisMonth || 0) : 0;
  const premiumLeft = Math.max(0, 5 - premiumUsed);

  document.getElementById('cpStats').innerHTML = `
    <div class="stat-card" style="--accent: #5EEAD4; --accent-40: #5EEAD466; --accent-80: #5EEAD4cc;">
      <div class="label">VENTAS DE LA SEMANA</div>
      <div class="value" style="color: #5EEAD4;">${total}</div>
    </div>
    <div class="stat-card" style="--accent: #FFD93D; --accent-40: #FFD93D66; --accent-80: #FFD93Dcc;">
      <div class="label">LÍDER ACTUAL</div>
      <div class="value" style="color: #FFD93D;">${leaderName}</div>
    </div>
    <div class="stat-card" style="--accent: ${commissionColor}; --accent-40: ${commissionColor}66; --accent-80: ${commissionColor}cc;">
      <div class="label">COMISIÓN DEL DÍA</div>
      <div class="value" style="color: ${commissionColor};">${commissionLabel}</div>
    </div>
    <div class="stat-card" style="--accent: #FF4FB6; --accent-40: #FF4FB666; --accent-80: #FF4FB6cc;">
      <div class="label">★ PREMIUM RESTANTES (MES)</div>
      <div class="value" style="color: #FF4FB6;">${premiumLeft}/5</div>
    </div>
  `;

  // Lista organizada por vendedor (orden alfabético)
  const orderedSellers = [...SELLERS].sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('cpGrid').innerHTML = orderedSellers.map(s => {
    const total = state.sellers[s.id] || 0;
    const accentVars = `--accent: ${s.color}; --accent-alt: ${s.colorAlt}; --accent-15: ${s.color}26; --accent-40: ${s.color}66; --accent-50: ${s.color}80; --accent-80: ${s.color}cc;`;
    return `
    <div class="seller-block" style="${accentVars}">
      <div class="seller-block-head">
        <div style="filter: drop-shadow(0 0 8px ${s.color});">${avatarSVG(s.avatar, s.color, s.colorAlt, 56)}</div>
        <div class="seller-block-info">
          <div class="seller-block-name">${s.name}</div>
          <div class="seller-block-total">TOTAL: <strong>${total}</strong> / ${WEEK_TARGET}</div>
        </div>
      </div>
      <div class="page-btns">
        ${s.pages.map(p => `
          <button class="page-btn" data-page="${p}" style="${accentVars}">
            <div class="page-btn-info">
              <div class="page-btn-name">${p}</div>
              <div class="page-btn-count">VENTAS: <strong>${state.pages[p] || 0}</strong></div>
            </div>
            <div class="page-btn-plus">+1</div>
          </button>
        `).join('')}
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => addSale(btn.dataset.page));
  });

  // Ranking completo con desglose por página si tiene 2+
  document.getElementById('cpSummaryBody').innerHTML = ranked.map((s, i) => {
    const isTop = i < 4;
    const breakdown = s.pages.length >= 2
      ? s.pages.map(p => `<span>${p}: ${state.pages[p] || 0}</span>`).join(' · ')
      : s.pages[0];
    return `
    <div class="summary-row ${isTop ? 'top' : ''}" style="--accent: ${s.color}; --accent-15: ${s.color}20;">
      <span class="summary-rank" style="color: ${isTop ? s.color : 'rgba(255,255,255,0.3)'}">#${i + 1}</span>
      <div>${avatarSVG(s.avatar, s.color, s.colorAlt, 28)}</div>
      <div>
        <div class="summary-name">${s.name}</div>
        <div class="summary-pages">${breakdown}</div>
      </div>
      <span class="summary-total" style="color: ${s.color}; ${isTop ? `text-shadow: 0 0 10px ${s.color};` : ''}">${s.total}</span>
    </div>`;
  }).join('');
}

function renderAll() {
  renderControlPanel();
}

// ============== Botones ==============
document.getElementById('btnUndo').addEventListener('click', undoLastSale);

let resetMode = false, resetTimer = null;
const btnReset = document.getElementById('btnReset');
btnReset.addEventListener('click', () => {
  if (!resetMode) {
    resetMode = true;
    btnReset.classList.add('solid');
    btnReset.textContent = '✓ CONFIRMAR';
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetMode = false;
      btnReset.classList.remove('solid');
      btnReset.textContent = '⟳ RESET';
    }, 4000);
  } else {
    resetAll();
    resetMode = false;
    btnReset.classList.remove('solid');
    btnReset.textContent = '⟳ RESET';
    if (resetTimer) clearTimeout(resetTimer);
  }
});

let weekMode = false, weekTimer = null;
const btnWeek = document.getElementById('btnWeek');
btnWeek.addEventListener('click', () => {
  if (!weekMode) {
    weekMode = true;
    btnWeek.classList.add('confirm');
    btnWeek.textContent = '✓ CONFIRMAR CIERRE';
    if (weekTimer) clearTimeout(weekTimer);
    weekTimer = setTimeout(() => {
      weekMode = false;
      btnWeek.classList.remove('confirm');
      btnWeek.textContent = '🏁 CERRAR SEMANA';
    }, 4000);
  } else {
    closeWeek(true);
    weekMode = false;
    btnWeek.classList.remove('confirm');
    btnWeek.textContent = '🏁 CERRAR SEMANA';
    if (weekTimer) clearTimeout(weekTimer);
  }
});

// ============== Botón REVELAR COMISIÓN ==============
const btnReveal = document.getElementById('btnReveal');
btnReveal.addEventListener('click', () => {
  Sounds.init(); // primer click activa el contexto de audio
  const today = todayStr();
  const alreadyRolledToday = state.commission && state.commission.todayDate === today && state.commission.todayAmount;

  if (alreadyRolledToday) {
    if (!confirm(
      `Ya se reveló la comisión de HOY: $${state.commission.todayAmount} MXN${state.commission.todayPremium ? ' ★ PREMIUM' : ''}.\n\n` +
      `Si pulsas OK volveré a mostrar la animación a los vendedores con el mismo monto.\n\n` +
      `(Las comisiones acumuladas de cada vendedor NO se pierden — siguen sumándose.)`
    )) {
      return;
    }
  }

  triggerCommissionReveal();
  renderAll();
});

function updateRevealBtn() {
  const today = todayStr();
  const alreadyRolledToday = state.commission && state.commission.todayDate === today && state.commission.todayAmount;
  if (alreadyRolledToday) {
    btnReveal.textContent = `🔄 REPETIR · HOY: $${state.commission.todayAmount}${state.commission.todayPremium ? ' ★' : ''}`;
    btnReveal.title = 'Ya se reveló hoy. Click para repetir la animación con el mismo monto. Las comisiones acumuladas se mantienen entre días.';
  } else {
    btnReveal.textContent = '💰 REVELAR COMISIÓN DEL DÍA';
    btnReveal.title = 'Revela la comisión de hoy con animación dramática para los vendedores.';
  }
}

// ============== Init ==============
prevTopIds = getRanked().slice(0, 4).map(r => r.id);
prevLeader = getRanked()[0]?.id;
initParticles();
setupCrossTabSync();
renderAll();
updateRevealBtn();

// Activar audio context al primer click (browser policy)
document.addEventListener('click', () => Sounds.init(), { once: true });

// Re-render cuando cambia el state (incluye actualización de botón de revelar)
const _renderAll_orig = renderAll;
renderAll = function() {
  _renderAll_orig();
  updateRevealBtn();
};
</script>

</body>
</html>
